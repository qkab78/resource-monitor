[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
domain = { path = "crates/domain" }
application = { path = "crates/application" }
infrastructure = { path = "crates/infrastructure" }
ui = { path = "crates/ui" }
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
sysinfo = "0.40.1"
libc = "0.2.191"
